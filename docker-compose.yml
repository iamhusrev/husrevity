# Production stack for husrevity. Run from repo root.
#
# Single env-driven compose file. Container names, ports, volume, and network
# are all parameterized by ${STACK_NAME} (and the *_HOST_PORT vars), defaulting
# to the prod values — so plain `docker compose up -d` brings prod up. Local
# development still uses `bun run dev` directly (hot reload); this file is for
# the prod Mac and the CI runner.
#
# Stack:
#   STACK_NAME=husrevity-prod   hosts :4090/:3090/:5490   api/app.iamhusrev.com
#
# The env-driven parameterization is kept so a future hotfix stack on different
# ports is a one-liner — but the day-to-day setup is a single prod stack.
#
# Topology: Cloudflare Tunnel terminates TLS at the edge and forwards to
# 127.0.0.1 on this host. There is no Caddy, no nginx, no open inbound port.
# See ~/iamhusrev-prod/RUNBOOK.md for the full bring-up.
#
# Prerequisites:
#   1. apps/api/.env.prod points at the canonical secrets file
#      (~/.husrevity/api.env)
#   2. Repo root .env points at the same file (compose ${VAR} interpolation)
#   3. Cloudflare Tunnel "husrevity" is provisioned with ingress for
#      api.iamhusrev.com (→ :4090) and app.iamhusrev.com (→ :3090).
#
# Boot order: postgres → api (runs migrations) → web.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${STACK_NAME:-husrevity-prod}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HUSREVITY_DB_NAME:-husrevity_prod}
      POSTGRES_USER: ${HUSREVITY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${HUSREVITY_DB_PASSWORD:?HUSREVITY_DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback bind only — owner-policy port (5490 prod, 5491 staging).
    # NOT reachable from LAN or the internet (Tunnel doesn't know about it).
    # Use 127.0.0.1:5490/5491 from this Mac for DBeaver/TablePlus/psql access.
    ports:
      - "127.0.0.1:${HUSREVITY_DB_HOST_PORT:-5490}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${HUSREVITY_DB_USER:-postgres} -d ${HUSREVITY_DB_NAME:-husrevity_prod}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ${STACK_NAME:-husrevity-prod}-api
    restart: unless-stopped
    env_file:
      - apps/api/.env.prod
    # Loopback bind only — cloudflared on the host hits this port.
    # No LAN exposure, no public exposure.
    ports:
      - "127.0.0.1:${HUSREVITY_API_HOST_PORT:-4090}:4090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  web:
    build:
      context: .
      dockerfile: apps/web/dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.iamhusrev.com/api}
    container_name: ${STACK_NAME:-husrevity-prod}-web
    restart: unless-stopped
    # Loopback bind only — cloudflared on the host hits this port.
    ports:
      - "127.0.0.1:${HUSREVITY_WEB_HOST_PORT:-3090}:3090"
    networks:
      - app

volumes:
  pgdata:
    name: ${STACK_NAME:-husrevity-prod}_pgdata

networks:
  app:
    name: ${STACK_NAME:-husrevity-prod}
