# Production stack for husrevity (api + web). Run from repo root.
#
# Postgres is NOT part of this stack. husrevity connects to the shared, long-
# lived Postgres server defined in ~/iamhusrev-prod/postgres/docker-compose.yml
# over the external `iamhusrev-data` network, reaching it at the hostname
# `postgres` (database husrevity_prod, role husrevity). Bring the shared
# postgres up FIRST — see ~/iamhusrev-prod/RUNBOOK.md.
#
# Container names / host ports stay parameterized by ${STACK_NAME} and the
# *_HOST_PORT vars (defaults bring prod up with a plain `docker compose up -d`).
#
# Stack:
#   STACK_NAME=husrevity-prod   hosts :4090/:3090   api/app.iamhusrev.com
#
# Topology: Cloudflare Tunnel terminates TLS at the edge and forwards to
# 127.0.0.1 on this host. There is no Caddy, no nginx, no open inbound port.
# See ~/iamhusrev-prod/RUNBOOK.md for the full bring-up.
#
# Prerequisites:
#   1. Shared postgres is up (network `iamhusrev-data` exists, db husrevity_prod
#      + role husrevity created). See ~/iamhusrev-prod/postgres/.
#   2. apps/api/.env.prod points at the canonical secrets file (~/.husrevity/api.env)
#      with HUSREVITY_DB_HOST=postgres, HUSREVITY_DB_USER=husrevity, and the
#      matching HUSREVITY_DB_PASSWORD from ~/.iamhusrev-postgres/env.
#   3. Repo root .env points at the same file (compose ${VAR} interpolation).
#   4. Cloudflare Tunnel "husrevity" has ingress for api.iamhusrev.com (→ :4090)
#      and app.iamhusrev.com (→ :3090).
#
# Boot order: (shared postgres) → api (runs migrations) → web.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ${STACK_NAME:-husrevity-prod}-api
    restart: unless-stopped
    env_file:
      - apps/api/.env.prod
    # Loopback bind only — cloudflared on the host hits this port.
    # No LAN exposure, no public exposure.
    ports:
      - "127.0.0.1:${HUSREVITY_API_HOST_PORT:-4090}:4090"
    # Reaches the shared Postgres at hostname `postgres` on this network.
    networks:
      - iamhusrev-data

  web:
    build:
      context: .
      dockerfile: apps/web/dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.iamhusrev.com/api}
    container_name: ${STACK_NAME:-husrevity-prod}-web
    restart: unless-stopped
    # Loopback bind only — cloudflared on the host hits this port.
    ports:
      - "127.0.0.1:${HUSREVITY_WEB_HOST_PORT:-3090}:3090"

networks:
  # Shared data network, owned by ~/iamhusrev-prod/postgres. Must already exist
  # (`docker compose up` on the shared postgres stack creates it).
  iamhusrev-data:
    name: iamhusrev-data
    external: true
