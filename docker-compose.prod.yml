# Production stack for husrevity. Run from repo root.
#
# Topology: Cloudflare Tunnel terminates TLS at the edge and forwards to
# 127.0.0.1 on this host. There is no Caddy, no nginx, no open inbound port.
# The host's static public IP is reserved for ops (SSH and a future mobile-API
# direct path). See ~/iamhusrev-prod/RUNBOOK.md for the full bring-up (the
# infra repo owns host-level config — tunnel, launchagents, backup scripts).
#
# Prerequisites:
#   1. apps/api/.env.prod exists (symlink to ~/.husrevity/api.env recommended)
#   2. Repo root has a `.env` symlink to the same file so compose can do
#      ${VAR} interpolation for postgres credentials.
#         ln -s ~/.husrevity/api.env .env
#         ln -s ~/.husrevity/api.env apps/api/.env.prod
#   3. Cloudflare Tunnel "husrevity" is provisioned and running (LaunchAgent
#      ~/iamhusrev-prod/launchagents/com.iamhusrev.cloudflared.plist) with
#      ingress:
#         app.iamhusrev.com → http://127.0.0.1:3090
#         api.iamhusrev.com → http://127.0.0.1:4090
#
# Boot order: postgres → api (runs migrations) → web.

services:
  postgres:
    image: postgres:16-alpine
    container_name: husrevity-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HUSREVITY_DB_NAME:-husrevity_prod}
      POSTGRES_USER: ${HUSREVITY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${HUSREVITY_DB_PASSWORD:?HUSREVITY_DB_PASSWORD must be set}
    volumes:
      - husrevity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${HUSREVITY_DB_USER:-postgres} -d ${HUSREVITY_DB_NAME:-husrevity_prod}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - husrevity-prod

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: husrevity-prod-api
    restart: unless-stopped
    env_file:
      - apps/api/.env.prod
    # Loopback bind only — cloudflared on the host hits 127.0.0.1:4090.
    # No LAN exposure, no public exposure.
    ports:
      - "127.0.0.1:4090:4090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - husrevity-prod

  web:
    build:
      context: .
      dockerfile: apps/web/dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.iamhusrev.com/api}
    container_name: husrevity-prod-web
    restart: unless-stopped
    # Loopback bind only — cloudflared on the host hits 127.0.0.1:3090.
    ports:
      - "127.0.0.1:3090:3090"
    networks:
      - husrevity-prod

volumes:
  husrevity_pgdata:

networks:
  husrevity-prod:
    name: husrevity-prod
