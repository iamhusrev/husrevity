name: Deploy to prod (master)

# Triggers on push to master. Deploys the husrevity-prod stack on the
# self-hosted Mac runner. Manual rerun: gh workflow run deploy.yml --ref master.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Prod and staging deploys are independent (different concurrency groups).
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + restart prod stack
    runs-on: [self-hosted, macOS, iamhusrev-prod]
    timeout-minutes: 20
    env:
      STACK_NAME: husrevity-prod
      HUSREVITY_API_HOST_PORT: 4090
      HUSREVITY_WEB_HOST_PORT: 3090
      HUSREVITY_DB_HOST_PORT: 5490
      NEXT_PUBLIC_API_URL: https://api.iamhusrev.com/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup runner PATH (Docker Desktop + Homebrew)
        run: |
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/Applications/Docker.app/Contents/Resources/bin" >> "$GITHUB_PATH"
          /Applications/Docker.app/Contents/Resources/bin/docker --version

      - name: Point env symlinks at prod secrets
        run: |
          # ~/.husrevity/api.env is the canonical PROD secrets file (chmod 600).
          # actions/checkout's default `clean: true` runs `git clean -ffdx`
          # which deletes our gitignored symlinks — so we recreate them
          # every deploy. Same file feeds compose env_file (api) and
          # ${VAR} interpolation (root .env).
          if [[ ! -f "$HOME/.husrevity/api.env" ]]; then
            echo "::error::$HOME/.husrevity/api.env missing on this host. Provision prod secrets first (see ~/iamhusrev-prod/RUNBOOK.md §3)."
            exit 1
          fi
          ln -sfn "$HOME/.husrevity/api.env" apps/api/.env.prod
          ln -sfn "$HOME/.husrevity/api.env" .env
          ls -la apps/api/.env.prod .env

      - name: Build images
        run: docker compose build

      - name: Apply stack (postgres → api → web)
        run: docker compose up -d

      - name: Wait for api health (loopback)
        run: |
          for i in {1..15}; do
            if curl -fsS -m 3 http://localhost:${HUSREVITY_API_HOST_PORT}/api/health > /dev/null; then
              echo "api healthy ✓"
              exit 0
            fi
            echo "attempt $i/15 — api not ready, sleep 4s"
            sleep 4
          done
          echo "::error::api never became healthy"
          docker compose logs api --tail=100
          exit 1

      - name: Public smoke test (through Cloudflare Tunnel)
        run: |
          curl -fsS -m 8 --retry 5 --retry-delay 4 --retry-connrefused \
            https://api.iamhusrev.com/api/health || {
            echo "::warning::public smoke (HTTPS) failed — check cloudflared LaunchAgent status."
            exit 0
          }
