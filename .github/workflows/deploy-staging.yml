name: Deploy to staging (dev)

# Triggers on push to dev. Deploys the husrevity-staging stack on the same
# self-hosted Mac runner. Staging is a parallel copy of prod — its own
# postgres volume, ports 3091/4091/5491, hostnames staging-{app,api}.iamhusrev.com.
# Prod is completely untouched.
#
# Manual rerun: gh workflow run deploy-staging.yml --ref dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Staging concurrency group is independent of prod (prod-deploy). Both can
# never run on the same runner at the same time anyway (single runner), but
# the separate group is correct for the day we add a second runner.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + restart staging stack
    runs-on: [self-hosted, macOS, iamhusrev-prod]
    timeout-minutes: 20
    env:
      STACK_NAME: husrevity-staging
      HUSREVITY_API_HOST_PORT: 4091
      HUSREVITY_WEB_HOST_PORT: 3091
      HUSREVITY_DB_HOST_PORT: 5491
      NEXT_PUBLIC_API_URL: https://staging-api.iamhusrev.com/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup runner PATH (Docker Desktop + Homebrew)
        run: |
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/Applications/Docker.app/Contents/Resources/bin" >> "$GITHUB_PATH"
          /Applications/Docker.app/Contents/Resources/bin/docker --version

      - name: Point env symlinks at staging secrets
        run: |
          # ~/.husrevity/api.staging.env is the canonical STAGING secrets file
          # (chmod 600). Compose reads it via env_file (api) and ${VAR}
          # interpolation (root .env). We re-point the symlinks every deploy
          # so prod and staging can share the same checkout dir safely.
          if [[ ! -f "$HOME/.husrevity/api.staging.env" ]]; then
            echo "::error::$HOME/.husrevity/api.staging.env missing on this host. Provision staging secrets first (see ~/iamhusrev-prod/RUNBOOK.md)."
            exit 1
          fi
          ln -sfn "$HOME/.husrevity/api.staging.env" apps/api/.env.prod
          ln -sfn "$HOME/.husrevity/api.staging.env" .env
          ls -la apps/api/.env.prod .env

      - name: Build images
        run: docker compose build

      - name: Apply stack (postgres → api → web)
        run: docker compose up -d

      - name: Wait for api health (loopback)
        run: |
          for i in {1..15}; do
            if curl -fsS -m 3 http://localhost:${HUSREVITY_API_HOST_PORT}/api/health > /dev/null; then
              echo "staging api healthy ✓"
              exit 0
            fi
            echo "attempt $i/15 — api not ready, sleep 4s"
            sleep 4
          done
          echo "::error::staging api never became healthy"
          docker compose logs api --tail=100
          exit 1

      - name: Public smoke test (through Cloudflare Tunnel)
        run: |
          curl -fsS -m 8 --retry 5 --retry-delay 4 --retry-connrefused \
            https://staging-api.iamhusrev.com/api/health || {
            echo "::warning::staging public smoke failed — check cloudflared ingress for staging-api.iamhusrev.com."
            exit 0
          }
