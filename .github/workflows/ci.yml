name: CI

# Build + lint + test on every push (any branch) and every pull request.
# Does NOT deploy. Deploy lives in:
#   - deploy.yml          → push to master  → PROD     (api/app.iamhusrev.com)
# Husrevity is prod-only (no staging environment). This CI also runs on
# master pushes, providing the lint+test gate deploy.yml doesn't run itself.
#
# Runs on the self-hosted Mac runner (same host that serves prod). Concurrency
# is per-ref so two unrelated branches can build in parallel; pushes to the
# same branch cancel the older run.

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + lint + test
    runs-on: [self-hosted, linux, iamhusrev-prod]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup runner PATH (bun)
        run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Sanity check (bun + node)
        run: |
          bun --version
          node --version || echo "node not available — that's OK if not needed"

      - name: Install workspaces (bun)
        run: bun install --frozen-lockfile

      - name: Build api
        run: bun --cwd apps/api run build

      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: https://api.iamhusrev.com/api
        run: bun --cwd apps/web run build

      - name: Lint web (next lint)
        run: bun --cwd apps/web run lint
        continue-on-error: false

      - name: Test api (jest, passWithNoTests)
        run: bun --cwd apps/api run test
