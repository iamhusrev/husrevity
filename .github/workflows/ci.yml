name: CI

# Build + lint + test on every push (any branch) and every pull request.
# Does NOT deploy: deploy.yml runs after a green CI run on master.
#
# Runs on GitHub-hosted runners. The repository is public, so a self-hosted runner
# would execute pull-request code from anyone on that machine.

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + lint + test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3'

      - name: Install workspaces (bun)
        run: bun install --frozen-lockfile

      - name: Build api
        run: bun --cwd apps/api run build

      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: https://api.iamhusrev.com/api
        run: bun --cwd apps/web run build

      - name: Lint web (next lint)
        run: bun --cwd apps/web run lint

      - name: Test api (jest, passWithNoTests)
        run: bun --cwd apps/api run test
