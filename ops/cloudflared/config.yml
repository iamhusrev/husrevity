# Husrevity production tunnel — named tunnel "husrevity".
#
# Provisioned manually (one-time):
#   cloudflared tunnel login
#   cloudflared tunnel create husrevity
#   cloudflared tunnel route dns husrevity app.iamhusrev.com
#   cloudflared tunnel route dns husrevity api.iamhusrev.com
#   mkdir -p ~/.config/husrevity/cloudflared
#   mv ~/.cloudflared/<UUID>.json ~/.config/husrevity/cloudflared/credentials.json
#   chmod 600 ~/.config/husrevity/cloudflared/credentials.json
#
# After provisioning, the LaunchAgent (ops/launchagents/com.iamhusrev.cloudflared.plist)
# runs `cloudflared tunnel --config <this file> run`.

tunnel: husrevity
credentials-file: /Users/husrev/.config/husrevity/cloudflared/credentials.json

# Defaults applied to every ingress entry unless overridden inline.
originRequest:
  # Cold-start budget — Next.js standalone is ~1s but bumping avoids edge 502s
  # during Docker container restarts.
  connectTimeout: 30s
  # Origin is loopback (127.0.0.1) — no TLS certificate to validate.
  noTLSVerify: true

ingress:
  # Husrevity API (NestJS) — see docker-compose.prod.yml api.ports.
  - hostname: api.iamhusrev.com
    service: http://127.0.0.1:4090

  # Husrevity web (Next.js) — see docker-compose.prod.yml web.ports.
  - hostname: app.iamhusrev.com
    service: http://127.0.0.1:3090

  # Future personal projects on the same Mac follow this pattern:
  #   - hostname: <project>.iamhusrev.com
  #     service: http://127.0.0.1:<port>
  # then `cloudflared tunnel route dns husrevity <project>.iamhusrev.com`.

  # Catch-all: anything else hitting this tunnel returns 404.
  - service: http_status:404
