<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Çevrimdışı | Husrevity</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem;
        text-align: center;
        background: radial-gradient(120% 100% at 50% 35%, #4f5358 0%, #2b2d30 100%);
        color: #e8eaed;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .mark {
        width: 132px;
        height: 132px;
        filter: drop-shadow(0 0 18px rgba(42, 212, 255, 0.65));
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 28rem;
        line-height: 1.55;
        color: #b9bcc1;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.7rem 1.4rem;
        border: 0;
        border-radius: 999px;
        background: #2ad4ff;
        color: #0b2027;
        font-size: 0.95rem;
        font-weight: 650;
        cursor: pointer;
      }
      button:hover {
        background: #4fdcff;
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g
        fill="none"
        stroke="#2ad4ff"
        stroke-width="96"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M 360 300 L 360 724" />
        <path d="M 360 470 Q 360 410 512 410 Q 664 410 664 470 L 664 724" />
      </g>
    </svg>
    <h1>Çevrimdışısınız</h1>
    <p>
      İnternet bağlantısı kurulamadı. Bağlantınızı kontrol edip yeniden deneyin —
      husrevity tekrar çevrimiçi olduğunuzda kaldığınız yerden devam eder.
    </p>
    <button type="button" onclick="location.reload()">Yeniden dene</button>
  </body>
</html>
