# Husrevity UI — Dependabot configuration.
# Weekly npm updates with minor + patch grouped; major versions raised as separate PRs
# (Dependabot's default is to NOT group what isn't listed in update-types, so majors stay solo).

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - ci
