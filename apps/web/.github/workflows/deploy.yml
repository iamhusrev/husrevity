# Husrevity UI — pull-based deployment to the home Mac.
# Fires on release publish or manual dispatch. Runs on the self-hosted runner.

name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (defaults to release tag if invoked from a release)"
        required: false
        default: ""

jobs:
  deploy:
    name: Deploy to iamhusrev-prod
    runs-on: [self-hosted, macOS, iamhusrev-prod]
    timeout-minutes: 10

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.release.tag_name }}" ]]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run deploy script
        # The script lives in the iamhusrev-deploy repo (cloned to /Users/husrev/deploy
        # on the runner). It pulls myhusrev-web, npm ci, build with prod env, pm2 reload,
        # smoke test, and notifies via webhook + email.
        run: bash /Users/husrev/deploy/scripts/deploy-frontend.sh "${{ steps.tag.outputs.value }}"

      - name: Notify on failure (extra belt-and-braces)
        if: failure() && env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"content\":\":x: UI deploy ${{ steps.tag.outputs.value }} failed in GitHub Actions runner. See run logs.\"}" \
            "${WEBHOOK_URL}" || true
