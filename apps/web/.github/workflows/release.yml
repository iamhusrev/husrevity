# Husrevity UI — release artifact builder.
# Triggered by version tags; produces a tarball with the standalone Next.js bundle.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        env:
          NEXT_PUBLIC_API_URL: https://api.iamhusrev.com/api
          NEXT_PUBLIC_APP_NAME: Husrevity
        run: npm run build

      - name: Bundle standalone output
        # The standalone bundle (.next/standalone/) ships server.js + a trimmed
        # node_modules. .next/static and public/ are NOT copied into standalone — they
        # need to live alongside server.js at runtime.
        run: |
          set -e
          mkdir -p release stage
          cp -R .next/standalone/. stage/
          mkdir -p stage/.next
          cp -R .next/static stage/.next/static
          cp -R public stage/public
          tar -czf "release/iamhusrev-ui-${{ github.ref_name }}.tgz" -C stage .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/iamhusrev-ui-${{ github.ref_name }}.tgz
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
